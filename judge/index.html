<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<!-- 화면 테마: 밝은 화면을 고른 사람은 첫 화면부터 밝게 (assets/theme.js 가 단추를 단다) -->
<script>try{if(localStorage.getItem('ep-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<script src="../assets/theme.js?v=547fe78e" defer></script>
<meta name="robots" content="noindex,nofollow">
<!-- 열람 링크의 토큰이 다른 사이트로 새지 않게 -->
<meta name="referrer" content="no-referrer">
<title>제출 · 투표 현황 · ENDPoinT</title>
<meta name="description" content="ENDPoinT 해커톤 제출 · 투표 현황. 팀마다 제출한 것과 투표 참여를 보고, 심사위원 · 운영진은 참여 토큰으로 자료를 봅니다.">
<link rel="icon" href="../assets/img/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="../assets/img/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@100;200;300;400;500;600&display=swap">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="../assets/submit.css?v=345818a4">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="../"><b>ENDPoinT</b><span>SeoulTech CSE Hackathon</span></a>
    <nav>
      <a href="../" class="sm-hide">홈</a>
      <a href="../#prize" class="sm-hide">심사안내</a>
      <a href="../judge/" class="on" aria-current="page"><span class="sm-hide">제출·투표 </span>현황</a>
      <a href="../submit/"><span class="sm-hide">결과물 </span>제출</a>
      <a href="../judge/vote/">투표</a>
    </nav>
    <div class="top-auth" id="top-auth" aria-live="polite"></div>
  </div>
</header>

<main>
  <div class="phead">
    <div class="wrap">
      <div class="pagehead">
        <div>
          <span class="lab blue">Status</span>
          <h1 class="ptitle">제출 · 투표 현황</h1>
        </div>
        <div class="stack">
          <div><span class="lab ko">제출 완료</span><b id="s-done" class="num">—</b></div>
          <div><span class="lab ko">발표 자료 · 결과물</span><b id="s-parts" class="num">—</b></div>
          <div><span class="lab ko">제출 마감</span><b id="s-deadline" class="num">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="wrap">
      <div class="demo-note" id="demo-note" hidden><b>미리보기 모드</b>서버에 연결하지 않은 화면입니다. 팀 이름과 자료는 모두 예시입니다.</div>
      <div class="gate" id="gate"></div>
      <div class="pub" id="pub" hidden aria-live="polite"></div>
      <div id="app" hidden>
        <div class="bar">
          <div class="tabs" id="tabs" role="tablist" aria-label="트랙"></div>
          <div class="tools">
            <span class="when" id="when"></span>
            <button class="chipbtn" type="button" id="only" aria-pressed="false">제출한 팀만 보기</button>
            <button class="chipbtn" type="button" id="reload">새로 고침</button>
          </div>
        </div>
        <div id="list"></div>
      </div>
      <noscript><p class="sub">이 화면에는 자바스크립트가 필요합니다. 브라우저 설정을 확인한 뒤 다시 열어 주세요.</p></noscript>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="f-in">
      <div>
        <div class="mark" style="margin-bottom:12px"><b>ENDPoinT</b><span>SeoulTech CSE Hackathon</span></div>
        <div>서울과학기술대학교 컴퓨터공학과 해커톤<br>EC · NL · 다락방 · Plum · TCP</div>
      </div>
      <div class="f-links">
        <a href="../">대회 안내</a>
        <a href="../#prize">심사안내</a>
        <a href="../privacy/">개인정보처리방침</a>
        <a href="../terms/">이용약관</a>
        <a href="mailto:recognize@seoultech.ac.kr">문의</a>
      </div>
    </div>
  </div>
</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="발표 자료 보기">
  <div class="viewer-bar">
    <div class="t"><b id="vw-title"></b><span id="vw-sub"></span></div>
    <button class="mini" type="button" id="vw-save" hidden>내려받기</button>
    <button class="mini" type="button" id="vw-close">닫기</button>
  </div>
  <div class="viewer-body" id="vw-body"></div>
</div>

<!-- 심사위원: 발표 자료(왼쪽)와 그 팀 평가(오른쪽)를 나란히 -->
<div class="review" id="review" hidden role="dialog" aria-modal="true" aria-label="발표 자료와 평가">
  <div class="rv-scrim"></div>
  <section class="rv-doc" id="rv-doc">
    <div class="rv-bar">
      <div class="t"><b id="rv-title"></b><span id="rv-sub"></span></div>
      <div class="rv-acts">
        <button class="mini quiet" type="button" id="rv-prev" aria-label="이전 팀" title="이전 팀 (←)">←</button>
        <button class="mini quiet" type="button" id="rv-next" aria-label="다음 팀" title="다음 팀 (→)">→</button>
        <button class="mini quiet" type="button" id="rv-save" hidden>내려받기</button>
        <button class="mini" type="button" id="rv-close">닫기</button>
      </div>
    </div>
    <div class="rv-body" id="rv-body"></div>
  </section>
  <aside class="rv-side" id="rv-side" aria-label="평가"></aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/submit-config.js?v=1f1bcd66"></script>
<script src="../assets/submit-core.js?v=ef300c28"></script>
<script src="../assets/judge-page.js?v=4738ee2f"></script>
</body>
</html>
